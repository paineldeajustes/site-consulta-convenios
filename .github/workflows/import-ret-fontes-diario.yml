name: Importar RET_FONTES e CadConvenios diariamente

on:
  push:
    paths:
      - '.github/workflows/import-ret-fontes-diario.yml'
      - '.github/supabase-functions/import-cad-convenios/index.ts'
      - '.github/supabase-functions/import-ret-fontes/index.ts'
  schedule:
    # 09:00 UTC = 06:00 no horário de Brasília.
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: import-ret-fontes
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verificar configuração do segredo
        env:
          IMPORT_FUNCTION_SECRET: ${{ secrets.IMPORT_FUNCTION_SECRET }}
        run: |
          if [ -z "$IMPORT_FUNCTION_SECRET" ]; then
            echo 'O segredo IMPORT_FUNCTION_SECRET não está configurado nos Actions secrets do repositório.'
            exit 1
          fi

      - name: Importar RET_FONTES.txt
        env:
          IMPORT_FUNCTION_SECRET: ${{ secrets.IMPORT_FUNCTION_SECRET }}
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 180 \
            --request POST \
            --url 'https://qkjudfvlaatdcaosadun.supabase.co/functions/v1/import-ret-fontes' \
            --header "Authorization: Bearer ${IMPORT_FUNCTION_SECRET}" \
            --header 'Content-Type: application/json' \
            --data '{}')
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true' >/dev/null

      - name: Importar CadConvenios.txt e atualizar o resumo do painel
        env:
          IMPORT_FUNCTION_SECRET: ${{ secrets.IMPORT_FUNCTION_SECRET }}
        run: |
          response=$(curl --fail-with-body --silent --show-error --max-time 240 \
            --request POST \
            --url 'https://qkjudfvlaatdcaosadun.supabase.co/functions/v1/import-cad-convenios' \
            --header "Authorization: Bearer ${IMPORT_FUNCTION_SECRET}" \
            --header 'Content-Type: application/json' \
            --data '{}')
          echo "$response" | jq .
          echo "$response" | jq -e '.success == true' >/dev/null
          echo "$response" | jq -e '.snapshot_refresh.success == true' >/dev/null

      - name: Concluir
        run: echo 'RET_FONTES.txt e CadConvenios.txt importados; snapshot atualizado sem TXT_EMPENHO/TXT_PAGAMENTO.'

# Reexecução solicitada em 10/11/2026 após atualização do RET_FONTES no Drive.
