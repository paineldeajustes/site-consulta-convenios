name: Atualizar dados do Brasil na Vida Real
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "brasil-na-vida-real/scripts/update_data.py"
      - ".github/workflows/update-ivr.yml"
      - "brasil-na-vida-real/data/indicadores.json"
permissions:
  contents: write
concurrency:
  group: atualizar-ivr
  cancel-in-progress: false
jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar leitor de planilhas da ANP
        run: python -m pip install --disable-pip-version-check openpyxl requests
      - name: Coletar fontes oficiais e notícias
        env:
          OPENAI_API_KEY: \${{ secrets.OPENAI_API_KEY }}
        run: python brasil-na-vida-real/scripts/update_data.py
      - name: Registrar atualização de dados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brasil-na-vida-real/data/indicadores.json
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos dados."
            exit 0
          fi
          git commit -m "Atualizar dados públicos do IVR"
          git push
